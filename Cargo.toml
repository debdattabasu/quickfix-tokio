[package]
name = "quickfix-tokio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A pure-Rust FIX protocol engine built natively on tokio"
authors = ["Debdatta Basu <debdatta.basu91@gmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/quickfix-tokio"
repository = "https://github.com/debdattabasu/quickfix-tokio"
homepage = "https://github.com/debdattabasu/quickfix-tokio"
keywords = ["fix", "quickfix", "trading", "protocol", "tokio"]
categories = ["network-programming", "asynchronous", "finance"]
# The vendored reference engines are dev-only context, never shipped in the crate.
exclude = ["/reference", "/target"]

[features]
default = ["fix44", "tls", "decimal"]
# Typed messages generated from spec/FIX44.xml (see src/bin/generate-fix.rs).
fix44 = []
# TLS transport via rustls (SocketUseSSL=Y). Pure Rust, no OpenSSL.
tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]
# Exact fixed-point decimal (rust_decimal) for typed price/qty/amount fields.
# Disable to fall back to f64 (crate::Amount aliases f64 then).
decimal = ["dep:rust_decimal"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros", "fs"] }
bytes = "1"
thiserror = "2"
async-trait = "0.1"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["clock", "std"], default-features = false }
tracing = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
rust_decimal = { version = "1", default-features = false, features = ["std", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = "0.3"
rcgen = "0.13"
